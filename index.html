<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MusicStand" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MusicStand</title>
    <script>
      // Before the first paint: the saved theme override and page background
      // (src/lib/theme.ts owns these keys and takes over once the app loads).
      (function () {
        var root = document.documentElement;
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var pref = localStorage.getItem('musicstand:theme');
          if (pref === 'light' || pref === 'dark') dark = pref === 'dark';
          var background = localStorage.getItem('musicstand:background');
          if (background) root.dataset.bg = background;
        } catch (error) {}
        root.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
